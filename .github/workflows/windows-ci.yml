name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      BUILD_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Acquire pinned DXC
        run: python tools/acquire_dxc.py

      - name: Check repository line endings
        run: ./tools/check_line_endings.ps1

      - name: Check pinned Audio initializer
        run: |
          python tests/audio/check_vendor.py
          exit $LASTEXITCODE

      - name: Build solution and run policy checks
        run: |
          New-Item -ItemType Directory -Path build/ci -Force | Out-Null
          & msbuild ./MorphicEngine.sln /m /t:Build `
            "/p:Configuration=$env:BUILD_CONFIGURATION" `
            "/p:Platform=$env:BUILD_PLATFORM" `
            /verbosity:minimal /bl:build/ci/msbuild.binlog `
            '/flp:LogFile=build/ci/msbuild.log;Verbosity=normal'
          exit $LASTEXITCODE

      - name: Run ordinary test suites
        run: |
          # The solution calls this platform x86; its projects output to Win32.
          $outputPlatform = if ($env:BUILD_PLATFORM -eq 'x86') { 'Win32' } else { 'x64' }
          $testExecutable = "./build/bin/$outputPlatform/$env:BUILD_CONFIGURATION/MorphicTests.exe"
          & $testExecutable -t1 --log-tag=ci --output-directory=build/ci/tests 2>&1 |
            Tee-Object -FilePath build/ci/tests-console.log
          exit $LASTEXITCODE

      - name: Test Host worker configuration and acceptance
        run: |
          $outputPlatform = if ($env:BUILD_PLATFORM -eq 'x86') { 'Win32' } else { 'x64' }
          ./tests/host_workers/run_tests.ps1 -Configuration $env:BUILD_CONFIGURATION `
            -Platform $outputPlatform 2>&1 |
            Tee-Object -FilePath build/ci/host-workers-console.log

      - name: Build lifecycle fixtures and test with one Host worker
        run: |
          $outputPlatform = if ($env:BUILD_PLATFORM -eq 'x86') { 'Win32' } else { 'x64' }
          $msbuild = (Get-Command msbuild -CommandType Application).Source
          ./tests/module_lifecycle/run_tests.ps1 -Configuration $env:BUILD_CONFIGURATION `
            -Platform $outputPlatform -WorkerCount 1 -MSBuild $msbuild -SkipSolutionBuild 2>&1 |
            Tee-Object -FilePath build/ci/lifecycle-one-worker-console.log

      - name: Test lifecycle with two requested Host workers
        run: |
          $outputPlatform = if ($env:BUILD_PLATFORM -eq 'x86') { 'Win32' } else { 'x64' }
          ./tests/module_lifecycle/run_tests.ps1 -Configuration $env:BUILD_CONFIGURATION `
            -Platform $outputPlatform -WorkerCount 2 -SkipBuild 2>&1 |
            Tee-Object -FilePath build/ci/lifecycle-two-workers-console.log

      - name: Build and test Host pump fixtures with one and two workers
        run: |
          $outputPlatform = if ($env:BUILD_PLATFORM -eq 'x86') { 'Win32' } else { 'x64' }
          $msbuild = (Get-Command msbuild -CommandType Application).Source
          ./tests/host_pump/run_tests.ps1 -Configuration $env:BUILD_CONFIGURATION `
            -Platform $outputPlatform -WorkerCount 1 -MSBuild $msbuild 2>&1 |
            Tee-Object -FilePath build/ci/pump-one-worker-console.log
          ./tests/host_pump/run_tests.ps1 -Configuration $env:BUILD_CONFIGURATION `
            -Platform $outputPlatform -WorkerCount 2 -SkipBuild 2>&1 |
            Tee-Object -FilePath build/ci/pump-two-workers-console.log

      - name: Build and test real Host input fixtures with one and two workers
        run: |
          $outputPlatform = if ($env:BUILD_PLATFORM -eq 'x86') { 'Win32' } else { 'x64' }
          $msbuild = (Get-Command msbuild -CommandType Application).Source
          ./tests/input_host/run_tests.ps1 -Configuration $env:BUILD_CONFIGURATION `
            -Platform $outputPlatform -WorkerCount 1 -MSBuild $msbuild 2>&1 |
            Tee-Object -FilePath build/ci/input-one-worker-console.log
          ./tests/input_host/run_tests.ps1 -Configuration $env:BUILD_CONFIGURATION `
            -Platform $outputPlatform -WorkerCount 2 -SkipBuild 2>&1 |
            Tee-Object -FilePath build/ci/input-two-workers-console.log

      - name: Upload build, policy, and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.configuration }}-${{ matrix.platform }}-diagnostics
          path: |
            build/ci/
            build/host-workers-*/development/logical-roots/test-logs/
            build/host-workers-*/development/logical-roots/test-output/
            build/lifecycle-runtime-*/development/logical-roots/test-logs/
            build/lifecycle-runtime-*/development/logical-roots/test-output/
            build/pump-*/
            build/input-host-*/
            development/logical-roots/logs/policy_validator/
          if-no-files-found: warn
          retention-days: 7
